[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemostack"
version = "0.1.0"
description = "See which symbols in your code an upgrade would break, before you upgrade"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "griffe[pypi]>=2.3.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

# Same list as the dev extra, for the uv path. uv sync installs dependency
# groups by default but not optional extras, and without this `uv run pytest`
# in a fresh clone silently falls through to whatever pytest is on PATH — a
# system interpreter that has none of the project's dependencies installed.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
mnemostack = "mnemostack.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["mnemostack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
